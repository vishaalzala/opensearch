name: Refresh Next.js dependency lockfile
on:
  push:
    branches: [main]
    paths: [package.json, '.github/workflows/refresh-next-lock.yml']
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Check Node.js
        run: node --version && npm --version
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify installation and typecheck
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m "chore: sync lockfile with patched Next.js"
          git push
